name: CI

on:
  pull_request:
  push:
    branches: [main]

# Pull requests cancel their own older run. A push to main does not: a deploy that is
# already running must finish, and the next push waits instead of starting a second one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kidzzy
          POSTGRES_PASSWORD: kidzzy
          POSTGRES_DB: kidzzy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kidzzy -d kidzzy_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://kidzzy:kidzzy@localhost:5432/kidzzy_test?schema=public
      JWT_ACCESS_SECRET: ci-only-secret-not-used-anywhere-else
      HUSKY: 0

    steps:
      - uses: actions/checkout@v4

      - name: Check the deploy script
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck scripts/deploy.sh scripts/deploy.test.sh
          bash scripts/deploy.test.sh

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Also builds packages/shared through the root prepare script
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Validate Prisma schema
        run: pnpm --filter @kidzzy/api prisma:validate

      - name: Lint API spec
        run: pnpm lint:api-spec

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Apply migrations to the test database
        run: pnpm --filter @kidzzy/api prisma:deploy

      # Fails when schema.prisma changed without a matching migration
      - name: Check migrations match the schema
        run: pnpm --filter @kidzzy/api prisma:check-drift

      - name: e2e tests
        run: pnpm test:e2e

      - name: Build
        run: pnpm build

      # The deploy job sends these directories as they were tested. Only main needs them.
      - name: Upload the tested build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: release
          retention-days: 5
          if-no-files-found: error
          path: |
            apps/api/dist
            apps/web/dist
            packages/shared/dist

  deploy:
    name: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    # Secrets live on this environment. A required reviewer there is the approval gate.
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download the tested build
        uses: actions/download-artifact@v4
        with:
          name: release
          path: release

      - name: Load the deploy key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Publish the build and run deploy.sh
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          # SSH_USER is not a secret ("deploy"), and as a secret GitHub masks every "deploy" in the
          # logs. The repository variable wins; the secret stays as the fallback until it is removed.
          SSH_USER: ${{ vars.SSH_USER || secrets.SSH_USER }}
        run: |
          set -euo pipefail
          test -f release/apps/api/dist/main.js
          test -f release/apps/web/dist/index.html
          test -f release/apps/web/dist/sw.js
          test -f release/packages/shared/dist/cjs/index.js
          if [[ -z "${SSH_HOST}" || -z "${SSH_USER}" ]]; then
            echo "SSH_HOST and SSH_USER (repository variable or secret) are required" >&2
            exit 1
          fi
          dest="${SSH_USER}@${SSH_HOST}"
          sha="${GITHUB_SHA}"
          remote="/tmp/kidzzy-release/${sha}"
          ssh_base=(-i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          # Nothing on the server changes until the tools and the working tree pass the preflight:
          # node (the .nvmrc major), pnpm, pm2, git, curl and rsync (the runner's rsync starts one on
          # the server too), a known commit and no hand-edited tracked file. This commit's script is
          # streamed from git, so it runs before any checkout. The fetch only updates refs.
          ssh "${ssh_base[@]}" "$dest" "set -euo pipefail; cd /www/wwwroot/kidzzy-admin; git fetch origin main; git show '${sha}:scripts/deploy.sh' | NVMRC_VALUE=\"\$(git show '${sha}:.nvmrc')\" bash -s -- preflight '${sha}'"
          ssh "${ssh_base[@]}" "$dest" "mkdir -p '${remote}/apps/api/dist' '${remote}/apps/web/dist' '${remote}/packages/shared/dist'"
          rsync -az --delete -e "ssh -i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            release/apps/api/dist/ "${dest}:${remote}/apps/api/dist/"
          rsync -az --delete -e "ssh -i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            release/apps/web/dist/ "${dest}:${remote}/apps/web/dist/"
          rsync -az --delete -e "ssh -i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            release/packages/shared/dist/ "${dest}:${remote}/packages/shared/dist/"
          # The preflight passed, so check out this commit and run its script, which checks again.
          ssh "${ssh_base[@]}" "$dest" "set -euo pipefail; cd /www/wwwroot/kidzzy-admin; git checkout --detach '${sha}'; bash scripts/deploy.sh '${sha}'"

  commits:
    name: commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0
      - name: Check commit messages of the pull request
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
