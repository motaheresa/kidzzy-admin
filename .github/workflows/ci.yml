name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel an older run of the same branch when a new commit arrives
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kidzzy
          POSTGRES_PASSWORD: kidzzy
          POSTGRES_DB: kidzzy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kidzzy -d kidzzy_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://kidzzy:kidzzy@localhost:5432/kidzzy_test?schema=public
      HUSKY: 0

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Also builds packages/shared through the root prepare script
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Validate Prisma schema
        run: pnpm --filter @kidzzy/api prisma:validate

      - name: Lint API spec
        run: pnpm lint:api-spec

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Apply migrations to the test database
        run: pnpm --filter @kidzzy/api prisma:deploy

      # Fails when schema.prisma changed without a matching migration
      - name: Check migrations match the schema
        run: pnpm --filter @kidzzy/api prisma:check-drift

      - name: e2e tests
        run: pnpm test:e2e

      - name: Build
        run: pnpm build

  commits:
    name: commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0
      - name: Check commit messages of the pull request
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
