  /students/{id}/payment-plans:
    post:
      tags:
        - Payments
      summary: New plan version for a student, from the next cycle
      description:
        Adds the next version with effectiveFromCycle = the number of the cycle in progress + 1 (BR-10), so the cycle
        in progress keeps its plan. A student who was never enrolled has no plan to change (STUDENT_HAS_NO_PLAN), and
        the same sessionsPerCycle and amount as the latest version changes nothing (PLAN_UNCHANGED).
      operationId: createStudentPlan
      x-permission: payments.manage
      x-story: US-20
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PlanChangeRefused'
  /instructors/{id}/payment-plans:
    post:
      tags:
        - Payments
      summary: Set or change an instructor's plan for one group
      description:
        An instructor is paid per group (ADR-0015), so a plan belongs to an (instructor, group) pair, with its own
        versions, its own starting point and its own cycles. The first plan of a pair is version 1 and opens cycle
        1, counting from openingCount (0 to sessionsPerCycle - 1, BR-14). It needs the instructor to be the group's
        current instructor (422 INSTRUCTOR_NOT_IN_GROUP). A later plan of the pair is the next version from the
        cycle after the one in progress, like a student's (BR-10), and is allowed even when the instructor no
        longer teaches the group, since the pair keeps its cycle; an openingCount other than 0 is refused
        (STARTING_POINT_LOCKED). The same sessionsPerCycle and amount as the pair's latest version changes nothing
        (PLAN_UNCHANGED). An unknown group or instructor is 404.
      operationId: createInstructorPlan
      x-permission: payments.manage
      x-story: US-21
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstructorPlanCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PlanChangeRefused'
        '422':
          $ref: '#/components/responses/Unprocessable'
