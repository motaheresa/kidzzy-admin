  /sessions/{id}/held:
    post:
      tags:
        - Sessions
      summary: Mark a scheduled session Held and give it the next number
      description: >
        Marks a Scheduled session Held. sessionNumber becomes one more than the highest number
        already used in the same group, or 1 when none. Marking Held never renumbers sessions
        that are already Held. Undo (SCRUM-41, BR-13) is the story that renumbers later Held
        sessions. The response does not include who changed the status; that is stored on the row.


        The session is counted into payment cycles in the same transaction (US-22, BR-06 to BR-08):
        once in the open cycle of every student whose enrollment covers the session's academy-local
        date, whether they attended or not (AC-02), and once in the open cycle of the (instructor on the
        session, the session's group) pair: an instructor is paid per group (ADR-0015), so it never counts
        in their cycles for other groups. cyclesUpdated lists those cycles with their counter after the change. When a
        counter reaches the plan's session count the cycle becomes due and the next one opens at 0
        under the plan version in effect for it (a plan change applies from the next cycle, BR-10).
        A student, or an instructor for this group, with no open cycle (no plan yet) is skipped: the
        session is not counted for them, and marking it Held is never refused because of that. The
        admin sets the starting point when creating the plan. When a group changes instructor, the
        former instructor's cycle for the group stays in progress and takes no new session (no
        partial payment), and the new instructor is counted once they have a plan for the group.


        scheduledAt must be at or before the server clock, otherwise 409 SESSION_NOT_STARTED.
        A session that is not Scheduled is 409 SESSION_NOT_SCHEDULED (including a second mark).


        Order is per group. Scope own is 409 SESSION_OUT_OF_ORDER when another session of the
        group has a strictly earlier scheduledAt and is still Scheduled. Scope any (the admin)
        may mark Held anyway: the earlier session stays Scheduled, so it is not numbered and
        will not enter a payment cycle. Cancelling that missed session is SCRUM-27. Both scopes
        are 409 SESSION_OUT_OF_ORDER when a Held session of the group has a strictly later
        scheduledAt, so this session cannot take a higher number than one that happens after it.
        An equal scheduledAt does not block, so two sessions at the same instant (a make-up, for
        example) do not block each other. A later reschedule must refuse a move to before the
        latest Held session of the group.


        Scope own may mark Held only when the instructor on the session is the caller. Being the
        group's current instructor is not enough. After an instructor change, an unrecorded
        session stays on the previous instructor, and only an admin can record it or use the
        unlock above.
      operationId: markSessionHeld
      x-permission: sessions.update
      x-story: US-13, US-22
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeldResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
