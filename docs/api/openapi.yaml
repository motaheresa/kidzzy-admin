components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: httpOnly JWT access cookie set by /auth/login
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    pageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: Validation failed (VALIDATION_FAILED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Not signed in or token expired (UNAUTHENTICATED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description:
        Missing permission or not the user's own record (FORBIDDEN), or a temporary password must be changed first
        (PASSWORD_CHANGE_REQUIRED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No such record in this academy (NOT_FOUND)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Breaks a business rule in the current state
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    GroupRefused:
      description:
        Two slots overlap on a weekday, or a slot ends after midnight (SCHEDULE_OVERLAP), or the instructor is not an
        active instructor of the academy (INSTRUCTOR_NOT_ASSIGNABLE)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    EnrollConflict:
      description:
        The student is already in a group (STUDENT_ALREADY_ENROLLED), the group is inactive (GROUP_INACTIVE), or a
        starting point was sent for a student who already has cycles (STARTING_POINT_LOCKED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TransferConflict:
      description:
        The student is not in a group (NO_ACTIVE_ENROLLMENT), the target is the group they are in (SAME_GROUP), or the
        target group is inactive (GROUP_INACTIVE)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TransferRefused:
      description: The effective date is before the day the student joined the current group (ENROLLMENT_DATE_INVALID)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PlanChangeRefused:
      description:
        The student has no plan yet (STUDENT_HAS_NO_PLAN, students only), or the plan is the same as the latest
        version (PLAN_UNCHANGED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    EnrollRefused:
      description:
        The student is not an active student of the academy (STUDENT_NOT_ENROLLABLE), the starting point is not less
        than the plan's sessions per cycle (STARTING_POINT_OUT_OF_RANGE), or the start date is not after the end of
        the student's last enrollment (ENROLLMENT_DATE_INVALID)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PasswordChangeRequired:
      description: A temporary password must be changed first (PASSWORD_CHANGE_REQUIRED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PasswordChangeRefused:
      description: The current password is wrong (CURRENT_PASSWORD_INCORRECT) or the new one equals it (PASSWORD_UNCHANGED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    StudentCodeTaken:
      description: The code is already used by another student of the academy (STUDENT_CODE_TAKEN)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    LoginTaken:
      description: The email (EMAIL_TAKEN) or the phone (PHONE_TAKEN) is already used by another account of the academy
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: Values contradict each other
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit reached (RATE_LIMITED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      description: RFC 9457 Problem Details with a stable code
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          example: SESSION_NOT_SCHEDULED
        detail:
          type: string
        instance:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
            additionalProperties: false
            required:
              - field
              - message
    PageMeta:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
        total:
          type: integer
      additionalProperties: false
      required:
        - page
        - pageSize
        - total
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
      additionalProperties: false
      required:
        - status
    LoginRequest:
      type: object
      properties:
        login:
          type: string
          description: Email or phone
        password:
          type: string
          minLength: 8
      additionalProperties: false
      required:
        - login
        - password
    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 200
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
      additionalProperties: false
      required:
        - currentPassword
        - newPassword
    Me:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          anyOf:
            - type: string
              format: email
            - type: 'null'
        phone:
          anyOf:
            - type: string
            - type: 'null'
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
            example: sessions.update:own
        mustChangePassword:
          type: boolean
        academy:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            timezone:
              type: string
              example: Africa/Cairo
          additionalProperties: false
          required:
            - id
            - name
            - timezone
      additionalProperties: false
      required:
        - id
        - name
        - roles
        - permissions
        - mustChangePassword
        - academy
    Instructor:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          anyOf:
            - type: string
              format: email
            - type: 'null'
        phone:
          anyOf:
            - type: string
            - type: 'null'
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
          description: ISO 8601, UTC
      additionalProperties: false
      required:
        - id
        - name
        - email
        - phone
        - isActive
        - createdAt
    InstructorDetail:
      allOf:
        - $ref: '#/components/schemas/Instructor'
        - type: object
          properties:
            groups:
              type: array
              items:
                $ref: '#/components/schemas/GroupRef'
