openapi: 3.1.0
info:
  title: Academy Management System API
  version: 1.0.0
  description:
    'V1 API of the KidzzyCoders academy management system. Design rules: see the API Design V1 document. Every
    operation carries x-permission (the permission key it requires; scope own or any is resolved per role) and x-story (the
    backlog story it implements).'
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://app.kidzzy-coders.com/api/v1
    description: Production
  - url: http://localhost:3000/api/v1
    description: Local
security:
  - cookieAuth: []
tags:
  - name: Auth
    description: Login, cookies and the current user (E1)
  - name: System
    description: Operational endpoints
  - name: Instructors
    description: Instructor accounts (E2)
  - name: Students
    description: Student records, enrollments and transfers (E2, E3)
  - name: Groups
    description: Groups, weekly schedules and enrollment (E3)
  - name: Sessions
    description: 'Session lifecycle: generation, Held, cancel, reschedule, make-up, undo (E4)'
  - name: Attendance
    description: Attendance and performance and homework ratings (E5)
  - name: Payments
    description: Plans, starting point, cycles and payments (E6)
  - name: Notifications
    description: Notification center and web push (E7)
  - name: Reminder rules
    description: Configurable reminder timing (E7)
  - name: Announcements
    description: Messages from the admin (E8)
  - name: Materials
    description: Course material links (E8)
  - name: Admin
    description: Dashboard and audit log (E8)
paths:
  /auth/login:
    post:
      tags:
        - Auth
      summary: Log in and set the auth cookies
      operationId: login
      x-permission: public
      x-story: US-01
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Rotate the access and refresh cookies
      operationId: refresh
      x-permission: refresh cookie
      x-story: US-01
      security: []
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags:
        - Auth
      summary: Revoke the session and clear cookies
      operationId: logout
      x-permission: signed in
      x-story: US-01
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/me:
    get:
      tags:
        - Auth
      summary: Current user, roles and permissions
      operationId: getMe
      x-permission: signed in
      x-story: US-03
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/change-password:
    post:
      tags:
        - Auth
      summary: Change own password
      description:
        Works while a temporary password must be changed (it is one of the three routes allowed then). On success the
        password is replaced, mustChangePassword becomes false, every other session of the user ends, and this device
        gets new auth cookies (a new session). At most 5 attempts a minute per user.
      operationId: changePassword
      x-permission: signed in
      x-story: US-02
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/PasswordChangeRefused'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /health:
    get:
      tags:
        - System
      summary: Liveness check
      operationId: health
      x-permission: public
      x-story: '-'
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /instructors:
    get:
      tags:
        - Instructors
      summary: List instructors
      operationId: listInstructors
      x-permission: instructors.read
      x-story: US-04
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
          description:
            Part of the name (whatever the Arabic letter forms, diacritics and case, as in listStudents), of the email or
            of the phone's digits; % and _ match themselves
        - name: isActive
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Instructor'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
                additionalProperties: false
                required:
                  - data
                  - meta
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Instructors
      summary: Create an instructor account
      operationId: createInstructor
      x-permission: instructors.manage
      x-story: US-04
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstructorCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instructor'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/LoginTaken'
  /instructors/{id}:
    get:
      tags:
        - Instructors
      summary: Get an instructor with groups
      operationId: getInstructor
      x-permission: instructors.read
      x-story: US-04
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstructorDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Instructors
      summary: Edit an instructor
      operationId: updateInstructor
      x-permission: instructors.manage
      x-story: US-04
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstructorUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instructor'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/LoginTaken'
  /instructors/{id}/deactivate:
    post:
      tags:
        - Instructors
      summary: Deactivate an instructor
      description:
        The instructor can no longer log in, and every session ends at its next refresh (within 15 minutes). Nothing is
        deleted. Idempotent.
      operationId: deactivateInstructor
      x-permission: instructors.manage
      x-story: US-04
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instructor'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /instructors/{id}/reactivate:
    post:
      tags:
        - Instructors
      summary: Reactivate an instructor
      description: The instructor can log in again with their password. Idempotent.
      operationId: reactivateInstructor
      x-permission: instructors.manage
      x-story: US-04
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instructor'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /instructors/{id}/reset-password:
    post:
      tags:
        - Instructors
      summary: Set a temporary password
      description: The instructor must change it at the next login (mustChangePassword), and every session of theirs ends.
      operationId: resetInstructorPassword
      x-permission: instructors.manage
      x-story: US-02
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /students:
    get:
      tags:
        - Students
      summary: List and search students
      description: Scope own (an instructor) lists only the students with an open enrollment in a group the caller teaches.
      operationId: listStudents
      x-permission: students.read
      x-story: US-06
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
          description:
            Part of the name or of the code; an exact code match is listed first. Names match whatever the Arabic letter
            forms (أ إ آ / ا, ة / ه, ى / ي), diacritics, tatweel, Latin case and Arabic-Indic digits; % and _ match
            themselves.
        - name: groupId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Students with an open enrollment in this group
        - name: isActive
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Student'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
                additionalProperties: false
                required:
                  - data
                  - meta
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Students
      summary: Create a student record
      operationId: createStudent
      x-permission: students.manage
      x-story: US-05
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/StudentCodeTaken'
  /students/{id}:
    get:
      tags:
        - Students
      summary: Get a student
      operationId: getStudent
      x-permission: students.read
      x-story: US-05
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Students
      summary: Edit a student
      operationId: updateStudent
      x-permission: students.manage
      x-story: US-05
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StudentCodeTaken'
  /students/{id}/deactivate:
    post:
      tags:
        - Students
      summary: Deactivate a student and end the enrollment
      description:
        Nothing is deleted; the student's history and payments stay. Idempotent. The open enrollment ends with
        yesterday (academy-local) as its last day, or the day before its start when it starts later. The cycle in
        progress and the plan stay with the student.
      operationId: deactivateStudent
      x-permission: students.manage
      x-story: US-05
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /students/{id}/enrollments:
    get:
      tags:
        - Students
      summary: Group history of a student
      description:
        Every enrollment of the student, the latest first. Scope own (an instructor) needs the student to be in a group
        the caller teaches.
      operationId: listStudentEnrollments
      x-permission: students.read
      x-story: US-09
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Enrollment'
                additionalProperties: false
                required:
                  - data
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /students/{id}/transfer:
    post:
      tags:
        - Students
      summary: Transfer a student to another group
      description:
        One transaction. With effectiveDate D, the open enrollment ends on D - 1 and the new one starts on D, so a day
        never belongs to two enrollments. D may not be before the day the student joined the current group. The plan
        and the cycles belong to the student, so the cycle in progress and its plan are untouched (BR-11). Answers
        the new enrollment.
      operationId: transferStudent
      x-permission: enrollments.manage
      x-story: US-09
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TransferConflict'
        '422':
          $ref: '#/components/responses/TransferRefused'
  /students/{id}/attendance:
    get:
      tags:
        - Attendance
      summary: Attendance and ratings of a student
      description: >
        The student's attendance, newest session first, paged. Only Held sessions appear.


        Scope own sees only the records of sessions it can see (it teaches the group now, or it is
        the instructor on the session). It gets 403 when it has no link to the student: the
        student is not in a group it teaches now and none of their records is on a session it can
        see; a student it teaches now with nothing recorded yet is an empty page. Unknown or
        another academy's student is 404.
      operationId: getStudentAttendance
      x-permission: attendance.read
      x-story: US-19
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/StudentAttendanceItem'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
                additionalProperties: false
                required:
                  - data
                  - meta
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /groups:
    get:
      tags:
        - Groups
      summary: List groups
      description: With scope own (an instructor) only the groups they teach are listed; an instructorId of someone else finds none.
      operationId: listGroups
      x-permission: groups.read
      x-story: US-07
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - name: instructorId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: isActive
          in: query
          required: false
          schema:
            type: boolean
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
          description:
            Part of the name or the level, whatever the Arabic letter forms, diacritics and case; % and _ match
            themselves
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Group'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
                additionalProperties: false
                required:
                  - data
                  - meta
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Groups
      summary: Create a group with a weekly schedule
      operationId: createGroup
      x-permission: groups.create
      x-story: US-07
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/GroupRefused'
  /groups/{id}:
    get:
      tags:
        - Groups
      summary: Get a group
      operationId: getGroup
      x-permission: groups.read
      x-story: US-07
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Groups
      summary: Edit group details
      description:
        Only the fields sent change. With scope own (an instructor), only the group they teach can be edited, and
        sending instructorId is 403; the other fields are allowed. A new instructor must be assignable (422
        INSTRUCTOR_NOT_ASSIGNABLE); only the sessions still ahead and Scheduled take the new instructor. Setting
        isActive to false removes the generated sessions still ahead and Scheduled (Held and Cancelled stay); setting
        it back to true generates them again.
      operationId: updateGroup
      x-permission: groups.update
      x-story: US-10
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/GroupRefused'
  /groups/{id}/schedule:
    put:
      tags:
        - Groups
      summary: Replace the weekly schedule; regenerates future Scheduled sessions
      description:
        In one transaction. A slot that did not change keeps its sessions. A slot that left loses its future
        Scheduled sessions; if Held, Cancelled or past sessions still point at it, it is retired (kept as history,
        no longer part of the schedule) instead of deleted. New slots get their sessions. Held and Cancelled
        sessions never change. An inactive group only stores the slots. Same scope rule as updateGroup.
      operationId: replaceGroupSchedule
      x-permission: groups.update
      x-story: US-10
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleReplace'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/GroupRefused'
  /groups/{id}/enrollments:
    get:
      tags:
        - Groups
      summary: Current students of a group
      operationId: listGroupEnrollments
      x-permission: groups.read
      x-story: US-08
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Enrollment'
                additionalProperties: false
                required:
                  - data
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
        - Groups
      summary: Enroll a student with a plan and starting point
      description:
        One transaction. A student enrolled for the first time gets plan version 1 and cycle 1, counting from
