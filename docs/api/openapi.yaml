        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: httpOnly JWT access cookie set by /auth/login
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    pageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: Validation failed (VALIDATION_FAILED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Not signed in or token expired (UNAUTHENTICATED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description:
        Missing permission or not the user's own record (FORBIDDEN), or a temporary password must be changed first
        (PASSWORD_CHANGE_REQUIRED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No such record in this academy (NOT_FOUND)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Breaks a business rule in the current state
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    GroupRefused:
      description:
        Two slots overlap on a weekday, or a slot ends after midnight (SCHEDULE_OVERLAP), or the instructor is not an
        active instructor of the academy (INSTRUCTOR_NOT_ASSIGNABLE)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PasswordChangeRequired:
      description: A temporary password must be changed first (PASSWORD_CHANGE_REQUIRED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PasswordChangeRefused:
      description: The current password is wrong (CURRENT_PASSWORD_INCORRECT) or the new one equals it (PASSWORD_UNCHANGED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    StudentCodeTaken:
      description: The code is already used by another student of the academy (STUDENT_CODE_TAKEN)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    LoginTaken:
      description: The email (EMAIL_TAKEN) or the phone (PHONE_TAKEN) is already used by another account of the academy
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: Values contradict each other
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit reached (RATE_LIMITED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      description: RFC 9457 Problem Details with a stable code
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          example: SESSION_NOT_SCHEDULED
        detail:
          type: string
        instance:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
            additionalProperties: false
            required:
              - field
              - message
    PageMeta:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
        total:
          type: integer
      additionalProperties: false
      required:
        - page
        - pageSize
        - total
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
      additionalProperties: false
      required:
        - status
    LoginRequest:
      type: object
      properties:
        login:
          type: string
          description: Email or phone
        password:
          type: string
          minLength: 8
      additionalProperties: false
      required:
        - login
        - password
    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 200
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
      additionalProperties: false
      required:
        - currentPassword
        - newPassword
    Me:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          anyOf:
            - type: string
              format: email
            - type: 'null'
        phone:
          anyOf:
            - type: string
            - type: 'null'
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
            example: sessions.update:own
        mustChangePassword:
          type: boolean
        academy:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            timezone:
              type: string
              example: Africa/Cairo
          additionalProperties: false
          required:
            - id
            - name
            - timezone
      additionalProperties: false
      required:
        - id
        - name
        - roles
        - permissions
        - mustChangePassword
        - academy
    Instructor:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          anyOf:
            - type: string
              format: email
            - type: 'null'
        phone:
          anyOf:
            - type: string
            - type: 'null'
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
          description: ISO 8601, UTC
      additionalProperties: false
      required:
        - id
        - name
        - email
        - phone
        - isActive
        - createdAt
    InstructorDetail:
      allOf:
        - $ref: '#/components/schemas/Instructor'
        - type: object
          properties:
            groups:
              type: array
              items:
                $ref: '#/components/schemas/GroupRef'
          additionalProperties: false
          required:
            - groups
    InstructorCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed
        email:
          type: string
          format: email
          maxLength: 200
          description: Stored trimmed and lowercase
        phone:
          type: string
          description: Digits, with optional spaces, dashes, dots or brackets and a leading +; 6 to 20 digits, stored as digits only
        temporaryPassword:
          type: string
          minLength: 8
          maxLength: 128
      additionalProperties: false
      required:
        - name
        - temporaryPassword
      description: At least one of email or phone is required
    InstructorUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          anyOf:
            - type: string
              format: email
              maxLength: 200
            - type: 'null'
        phone:
          anyOf:
            - type: string
            - type: 'null'
      additionalProperties: false
      description: Only the fields sent change. null removes the email or the phone, but one of them must remain (400 otherwise).
    ResetPasswordRequest:
      type: object
      properties:
        temporaryPassword:
          type: string
          minLength: 8
          maxLength: 128
      additionalProperties: false
      required:
        - temporaryPassword
    GroupRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      additionalProperties: false
      required:
        - id
        - name
      description: Id and display name of a related record
    Student:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        age:
          anyOf:
            - type: integer
            - type: 'null'
        parentName:
          type: string
        parentPhone:
          type: string
        notes:
          anyOf:
            - type: string
            - type: 'null'
        isActive:
          type: boolean
        currentGroup:
          anyOf:
            - $ref: '#/components/schemas/GroupRef'
            - type: 'null'
        currentCycle:
          anyOf:
            - $ref: '#/components/schemas/PaymentCycle'
            - type: 'null'
      additionalProperties: false
      required:
        - id
        - code
        - name
        - age
        - parentName
        - parentPhone
        - notes
        - isActive
        - currentGroup
        - currentCycle
    StudentCreate:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 20
          pattern: ^\s*[A-Za-z0-9ء-ي٠-٩۰-۹][A-Za-z0-9ء-ي٠-٩۰-۹._/-]*\s*$
          description:
            Letters, digits and . _ / -. Stored trimmed and uppercase, with Arabic-Indic digits as 0-9 ("kc-٠٠١" is
            "KC-001"); unique per academy
        name:
          type: string
          minLength: 1
          maxLength: 100
        age:
          type: integer
          minimum: 3
          maximum: 25
        parentName:
          type: string
          minLength: 1
          maxLength: 100
        parentPhone:
          type: string
          description: Digits, with optional spaces, dashes, dots or brackets and a leading +; 6 to 20 digits, stored as digits only
        notes:
          type: string
          maxLength: 1000
          description: Empty after trimming means no notes (null)
      additionalProperties: false
      required:
        - code
        - name
        - parentName
        - parentPhone
    StudentUpdate:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 20
          pattern: ^\s*[A-Za-z0-9ء-ي٠-٩۰-۹][A-Za-z0-9ء-ي٠-٩۰-۹._/-]*\s*$
        name:
          type: string
          minLength: 1
          maxLength: 100
        age:
          anyOf:
            - type: integer
              minimum: 3
              maximum: 25
            - type: 'null'
        parentName:
          type: string
          minLength: 1
          maxLength: 100
        parentPhone:
          type: string
        notes:
          anyOf:
            - type: string
              maxLength: 1000
            - type: 'null'
      additionalProperties: false
      description: Only the fields sent change. null clears age or notes.
    Enrollment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        studentName:
          type: string
        group:
          $ref: '#/components/schemas/GroupRef'
        startDate:
          type: string
          format: date
          description: Academy-local date
        endDate:
          anyOf:
            - type: string
              format: date
              description: Academy-local date
            - type: 'null'
      additionalProperties: false
      required:
        - id
        - studentId
        - group
        - startDate
    TransferRequest:
      type: object
      properties:
        toGroupId:
          type: string
          format: uuid
        effectiveDate:
          type: string
          format: date
          description: Academy-local date
      additionalProperties: false
      required:
        - toGroupId
        - effectiveDate
    ScheduleSlot:
      type: object
      properties:
        weekday:
          type: integer
          minimum: 0
          maximum: 6
          description: 0 = Sunday
        startTime:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          example: '16:00'
          description: Academy-local time, 00:00 to 23:59
        durationMin:
          type: integer
          minimum: 15
          maximum: 240
          description: A slot must end by midnight
      additionalProperties: false
      required:
        - weekday
        - startTime
        - durationMin
    Group:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        level:
          type: string
        instructor:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
          additionalProperties: false
          required:
            - id
            - name
        startDate:
          type: string
          format: date
          description: Academy-local date
        isActive:
          type: boolean
        schedule:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleSlot'
        studentCount:
          type: integer
        heldCount:
          type: integer
        nextSessionAt:
          anyOf:
            - type: string
              format: date-time
              description: ISO 8601, UTC
            - type: 'null'
      additionalProperties: false
      required:
        - id
        - name
        - level
        - instructor
        - startDate
        - isActive
        - schedule
        - studentCount
        - heldCount
        - nextSessionAt
    GroupCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        level:
          type: string
          minLength: 1
          maxLength: 100
        instructorId:
          type: string
          format: uuid
          description: Must be an active instructor of the academy (INSTRUCTOR_NOT_ASSIGNABLE otherwise)
        startDate:
          type: string
          format: date
          description: Academy-local date
        schedule:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleSlot'
          minItems: 1
          maxItems: 14
          description: Two slots of the same weekday must not overlap (SCHEDULE_OVERLAP)
      additionalProperties: false
      required:
        - name
        - level
        - instructorId
        - startDate
        - schedule
    GroupUpdate:
      type: object
      properties:
        name:
          type: string
        level:
          type: string
        instructorId:
          type: string
          format: uuid
        isActive:
          type: boolean
      additionalProperties: false
    ScheduleReplace:
      type: object
      properties:
        schedule:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleSlot'
          minItems: 1
      additionalProperties: false
      required:
        - schedule
    PlanInput:
      type: object
      properties:
        sessionsPerCycle:
          type: integer
          minimum: 1
        amount:
          type: string
          pattern: ^\d+\.\d{2}$
          example: '1500.00'
          description: Decimal amount in EGP
      additionalProperties: false
      required:
        - sessionsPerCycle
        - amount
    EnrollRequest:
      type: object
      properties:
        studentId:
          type: string
          format: uuid
        startDate:
          type: string
          format: date
          description: Academy-local date
        plan:
          $ref: '#/components/schemas/PlanInput'
        openingCount:
          type: integer
          minimum: 0
          default: 0
          description: 'Starting point: sessions of the current cycle taken before the system (BR-14)'
      additionalProperties: false
      required:
        - studentId
        - startDate
        - plan
    GroupAttendance:
      type: object
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/Session'
        students:
          type: array
          items:
            type: object
            properties:
              student:
                $ref: '#/components/schemas/StudentRef'
              records:
                type: array
                items:
                  $ref: '#/components/schemas/AttendanceRecord'
            additionalProperties: false
            required:
              - student
              - records
      additionalProperties: false
      required:
        - sessions
        - students
    StudentRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
      additionalProperties: false
      required:
        - id
        - code
        - name
    Session:
      type: object
      properties:
        id:
          type: string
          format: uuid
        group:
          $ref: '#/components/schemas/GroupRef'
        instructorId:
          type: string
          format: uuid
        scheduledAt:
          type: string
          format: date-time
          description: ISO 8601, UTC
        durationMin:
          type: integer
        status:
          type: string
          enum:
            - scheduled
            - held
            - cancelled
        sessionNumber:
          anyOf:
            - type: integer
            - type: 'null'
        isMakeup:
          type: boolean
        compensatesSessionId:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
        cancelReason:
          anyOf:
            - type: string
            - type: 'null'
      additionalProperties: false
      required:
        - id
        - group
        - instructorId
        - scheduledAt
        - durationMin
        - status
        - isMakeup
    SessionCreate:
      type: object
      properties:
        scheduledAt:
          type: string
          format: date-time
          description: ISO 8601, UTC
        durationMin:
          type: integer
          minimum: 15
        compensatesSessionId:
          type: string
          format: uuid
      additionalProperties: false
      required:
        - scheduledAt
        - durationMin
    CancelRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
      additionalProperties: false
      required:
        - reason
    RescheduleRequest:
      type: object
      properties:
        scheduledAt:
          type: string
          format: date-time
          description: ISO 8601, UTC
      additionalProperties: false
      required:
        - scheduledAt
    CycleChange:
      type: object
      properties:
        cycleId:
          type: string
          format: uuid
        payeeType:
          type: string
          enum:
            - student
            - instructor
        studentId:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
        instructorId:
          anyOf:
            - type: string
              format: uuid
            - type: 'null'
        sessionsCounted:
          type: integer
        sessionsPerCycle:
          type: integer
        status:
          type: string
          enum:
            - in_progress
            - due
            - paid
      additionalProperties: false
      required:
        - cycleId
        - payeeType
        - sessionsCounted
        - sessionsPerCycle
        - status
    HeldResult:
      allOf:
        - $ref: '#/components/schemas/Session'
        - type: object
          properties:
            cyclesUpdated:
              type: array
              items:
                $ref: '#/components/schemas/CycleChange'
          additionalProperties: false
          required:
            - cyclesUpdated
    AttendanceRecord:
      type: object
      properties:
        studentId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - present
            - absent
        performanceRating:
          anyOf:
            - type: integer
              minimum: 1
              maximum: 5
            - type: 'null'
        homeworkRating:
          anyOf:
            - type: integer
              minimum: 1
              maximum: 5
            - type: 'null'
          description: null = No homework
      additionalProperties: false
      required:
        - studentId
        - status
    AttendanceSave:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceRecord'
          minItems: 1
      additionalProperties: false
      required:
        - records
    SessionAttendance:
      type: object
      properties:
        sessionId:
          type: string
          format: uuid
        records:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/AttendanceRecord'
              - type: object
                properties:
                  studentName:
                    type: string
                additionalProperties: false
      additionalProperties: false
      required:
        - sessionId
        - records
    StudentAttendanceItem:
      type: object
      properties:
